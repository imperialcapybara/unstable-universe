<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unstable SMP ARCHIVE</title>
</head>
<body>

    <h1>Unstable SMP Archive</h1>

    <p id="status">Connecting to Supabase...</p>

    <h2 id="title">Loading...</h2>
    <p id="episode"></p>
    <p id="pov"></p>
    <p id="youtube-id"></p>
    <p id="upload-date"></p>

    <h3>Short Summary</h3>
    <p id="short-summary"></p>

    <!-- Load Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://twxaolsihffsyfcunrhf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1-h5qADngoUkagXaxad4OQ_8GdWooj1";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadVideo() {
            const { data, error } = await db
                .from("videos")
                .select("episode, title, pov, youtube_id, upload_date, short_summary")
                .eq("episode", 1)
                .limit(1);

            if (error) {
                console.error(error);

                document.getElementById("status").textContent =
                    "Error connecting to Supabase :(";

                return;
            }

            document.getElementById("status").textContent =
                "Supabase connection works! :D";

            if (data && data.length > 0) {
                const video = data[0];

                document.getElementById("title").textContent =
                    video.title;

                document.getElementById("episode").textContent =
                    "Episode: " + video.episode;

                document.getElementById("pov").textContent =
                    "POV: " + video.pov;

                document.getElementById("youtube-id").textContent =
                    "YouTube ID: " + video.youtube_id;

                document.getElementById("upload-date").textContent =
                    "Uploaded: " + video.upload_date;

                document.getElementById("short-summary").textContent =
                    video.short_summary;

            } else {
                document.getElementById("status").textContent =
                    "Supabase connection works! :D";

                document.getElementById("title").textContent =
                    "Episode not found";
            }
        }

        loadVideo();
    </script>

</body>
</html>
